version: '3'

services:
    web:
        image: personal-front
        container_name: personal-front
        restart: always
        build:
            context: .
        ports:
            - 9035:3000
        environment:
            - NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            - NEXT_PUBLIC_API_SIGERH=$NEXT_PUBLIC_API_SIGERH
            - NEXT_PUBLIC_BACKEND_URL=$NEXT_PUBLIC_BACKEND_URL
            - NEXTAUTH_SECRET=$NEXTAUTH_SECRET
            - NEXTAUTH_URL=$NEXTAUTH_URL
            - NODE_TLS_REJECT_UNAUTHORIZED=$NODE_TLS_REJECT_UNAUTHORIZED
            - WSO2IS_CLIENT_ID=$WSO2IS_CLIENT_ID
            - WSO2IS_CLIENT_SECRET=$WSO2IS_CLIENT_SECRET
            - WSO2IS_HOST=$WSO2IS_HOST
            - WSO2IS_TENANT_NAME=$WSO2IS_TENANT_NAME
